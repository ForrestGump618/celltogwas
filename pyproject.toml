[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celltogwas"
version = "1.1.0a1"
description = "Regulatory-aware mapping and enrichment of GWAS loci across cell types"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  {name = "Qingyuan Zhuang", email = "zhuangqingyuan@foxmail.com"},
]
maintainers = [
  {name = "Qingyuan Zhuang", email = "zhuangqingyuan@foxmail.com"},
]
keywords = [
  "bioinformatics",
  "cell-type",
  "genetics",
  "genomics",
  "gwas",
  "single-cell",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
validation = ["matplotlib>=3.8"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/ForrestGump618/celltogwas"
Repository = "https://github.com/ForrestGump618/celltogwas"
Issues = "https://github.com/ForrestGump618/celltogwas/issues"

[project.scripts]
celltogwas = "celltogwas.cli:main"

[tool.setuptools.packages.find]
include = ["celltogwas*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
celltogwas = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
